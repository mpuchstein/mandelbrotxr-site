<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040b">
<title>Mandelbrot XR</title>
<style>
:root{
  --ink:#e9ecff; --muted:#a6aed3; --glass:rgba(8,10,28,.68); --line:rgba(196,204,255,.22);
  --accent:#8fd8ff; --accent-soft:rgba(143,216,255,.45); --accent-ink:#04050f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",P052,Georgia,serif;
  --sans:Optima,Candara,"Segoe UI","Noto Sans",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03040b;color:var(--ink);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
#landing{position:fixed;inset:0;display:flex;align-items:flex-end;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,4,11,0) 30%,rgba(3,4,11,.5) 62%,rgba(3,4,11,.9) 100%)}
#landing .intro{pointer-events:auto;max-width:38rem;padding:0 max(6vw,22px) max(7vh,calc(env(safe-area-inset-bottom) + 22px))}
.formula{font-family:var(--serif);font-style:italic;font-size:clamp(3.1rem,9.5vw,6.6rem);line-height:1;margin:0 0 .3em;
  letter-spacing:-.01em;text-shadow:0 0 42px var(--accent-soft)}
.formula sup{font-size:.55em;font-style:normal;vertical-align:.75em;margin-left:.02em}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.3rem,2.5vw,1.85rem);line-height:1.25;margin:0 0 .55rem;max-width:23em}
.lede{font-family:var(--serif);font-size:1.05rem;line-height:1.6;color:var(--muted);margin:0 0 1.35rem;max-width:33em}
.cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.cta button{border:1px solid var(--line);background:rgba(10,13,34,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:.82rem 1.2rem;border-radius:6px;font-size:1rem;transition:border-color .2s,background .2s}
.cta button:hover{border-color:var(--accent)}
.cta button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.status{font-size:.92rem;line-height:1.5;color:var(--muted);margin:0;max-width:36em}
#hud{position:fixed;inset:0;pointer-events:none}
#readout{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));
  font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;font-size:.95rem;line-height:1.45;padding:.55rem .85rem;
  background:var(--glass);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:15.5em}
#readout .k{display:inline-block;width:3.1em;color:var(--muted);font-style:italic}
#readout .dim{color:var(--accent);font-style:italic;font-size:.88rem;min-height:1.2em}
#jcap{position:absolute;right:max(14px,env(safe-area-inset-right));margin:0;font-family:var(--serif);font-style:italic;font-size:.85rem;color:var(--muted);text-align:center}
#hint{position:absolute;left:0;right:0;bottom:calc(4.6rem + env(safe-area-inset-bottom));margin:0 auto;max-width:34em;padding:0 1rem;text-align:center;
  font-family:var(--serif);font-style:italic;font-size:.95rem;line-height:1.45;color:var(--ink);text-shadow:0 1px 8px #000;transition:opacity .8s}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:.4rem;overflow-x:auto;pointer-events:auto;scrollbar-width:none;
  padding:.7rem max(12px,env(safe-area-inset-left)) max(.8rem,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(3,4,11,0),rgba(3,4,11,.82))}
#bar::-webkit-scrollbar{display:none}
#bar button{flex:0 0 auto;border:1px solid var(--line);background:var(--glass);border-radius:6px;padding:.62rem .9rem;font-size:.95rem;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#bar button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);max-width:min(30em,88vw);text-align:center;font-family:var(--serif);font-size:1.12rem;
  padding:.6rem 1.05rem;background:var(--glass);border:1px solid var(--line);border-radius:6px;opacity:0;transition:opacity .45s;pointer-events:none}
#toast.show{opacity:1}
#fatal{position:fixed;inset:auto 0 0 0;padding:1rem 1.2rem calc(1rem + env(safe-area-inset-bottom));background:#2a0b14;color:#ffd9df;font-family:var(--serif);font-size:1rem;line-height:1.45}
@media (prefers-reduced-motion:reduce){#toast,#hint,.cta button{transition:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="-1"></canvas>
<main id="landing">
  <div class="intro">
    <p class="formula" aria-label="z maps to z squared plus c"><i>z</i> ↦ <i>z</i><sup>2</sup> + <i>c</i></p>
    <h1>The Mandelbrot set as a place you can stand in</h1>
    <p class="lede">A holographic landscape whose ridges trace the set’s boundary. Aim at any ridge to fall into it. The detail holds for more than forty doublings of zoom.</p>
    <div class="cta">
      <button id="bVR" hidden>Enter VR</button>
      <button id="bAR" hidden>Enter AR</button>
      <button id="bGo">Explore in this browser</button>
    </div>
    <p id="status" class="status">Checking what this device supports…</p>
  </div>
</main>
<div id="hud" hidden>
  <div id="readout">
    <div><span class="k">Re</span><span id="roRe"></span></div>
    <div><span class="k">Im</span><span id="roIm"></span></div>
    <div><span class="k">Zoom</span><span id="roZ"></span></div>
    <div id="roS" class="dim"></div>
  </div>
  <p id="jcap">Julia set at the pointer</p>
  <p id="hint"></p>
  <nav id="bar" aria-label="Controls">
    <button data-a="back">Back</button>
    <button data-a="zoomOut">Zoom out</button>
    <button data-a="home">Home</button>
    <button data-a="dive">Dive</button>
    <button data-a="palette">Palette</button>
    <button data-a="height">Height</button>
    <button data-a="immerse">Immerse</button>
    <button data-a="gyro" hidden>Look around</button>
    <button data-a="stereo" hidden>Cardboard</button>
    <button data-a="place" hidden>Place again</button>
    <button data-a="sound">Sound off</button>
    <button data-a="exit">Exit</button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="fatal" hidden></div>
<script>
(() => {
'use strict';
// ───────────────────────── utilities ─────────────────────────
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const ease = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const now = () => performance.now();
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function fatal(msg) { const f = $('fatal'); f.textContent = msg; f.hidden = false; }
window.addEventListener('error', e => { console.error(e.error || e.message); fatal('Something broke: ' + (e.message || e.error) + '. Reload the page to try again.'); });

// column-major 4×4 matrices
const M = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(o, a, b) {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    for (let i = 0; i < 16; i += 4) {
      const b0=b[i],b1=b[i+1],b2=b[i+2],b3=b[i+3];
      o[i]=a00*b0+a10*b1+a20*b2+a30*b3; o[i+1]=a01*b0+a11*b1+a21*b2+a31*b3;
      o[i+2]=a02*b0+a12*b1+a22*b2+a32*b3; o[i+3]=a03*b0+a13*b1+a23*b2+a33*b3;
    }
    return o;
  },
  invert(o, a) {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
          b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    if (!det) return null; det = 1 / det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det; o[1]=(a02*b10-a01*b11-a03*b09)*det; o[2]=(a31*b05-a32*b04+a33*b03)*det; o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det; o[5]=(a00*b11-a02*b08+a03*b07)*det; o[6]=(a32*b02-a30*b05-a33*b01)*det; o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det; o[9]=(a01*b08-a00*b10-a03*b06)*det; o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det; o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
    return o;
  },
  persp(o, fovy, aspect, n, f) {
    const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f);
    o.fill(0); o[0] = t / aspect; o[5] = t; o[10] = (f + n) * nf; o[11] = -1; o[14] = 2 * f * n * nf; return o;
  },
  lookAt(o, e, c, up) {
    let zx = e[0]-c[0], zy = e[1]-c[1], zz = e[2]-c[2]; let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = up[1]*zz-up[2]*zy, xy = up[2]*zx-up[0]*zz, xz = up[0]*zy-up[1]*zx; l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy*xz-zz*xy, yy = zz*xx-zx*xz, yz = zx*xy-zy*xx;
    o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0; o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0; o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
    o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]); o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]); o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]); o[15]=1; return o;
  },
  // T · Ry(yaw) · S
  trsY(o, x, y, z, yaw, sx, sy, sz) {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    o[0]=c*sx; o[1]=0; o[2]=-s*sx; o[3]=0; o[4]=0; o[5]=sy; o[6]=0; o[7]=0;
    o[8]=s*sz; o[9]=0; o[10]=c*sz; o[11]=0; o[12]=x; o[13]=y; o[14]=z; o[15]=1; return o;
  },
  // T · Ry(yaw) · Rx(pitch) · S
  trsYX(o, x, y, z, yaw, pitch, sx, sy, sz) {
    const c = Math.cos(yaw), s = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    o[0]=c*sx; o[1]=0; o[2]=-s*sx; o[3]=0;
    o[4]=s*sp*sy; o[5]=cp*sy; o[6]=c*sp*sy; o[7]=0;
    o[8]=s*cp*sz; o[9]=-sp*sz; o[10]=c*cp*sz; o[11]=0;
    o[12]=x; o[13]=y; o[14]=z; o[15]=1; return o;
  },
  fromQuatPos(o, q, p) {
    const x=q[0],y=q[1],z=q[2],w=q[3],x2=x+x,y2=y+y,z2=z+z,xx=x*x2,xy=x*y2,xz=x*z2,yy=y*y2,yz=y*z2,zz=z*z2,wx=w*x2,wy=w*y2,wz=w*z2;
    o[0]=1-(yy+zz); o[1]=xy+wz; o[2]=xz-wy; o[3]=0; o[4]=xy-wz; o[5]=1-(xx+zz); o[6]=yz+wx; o[7]=0;
    o[8]=xz+wy; o[9]=yz-wx; o[10]=1-(xx+yy); o[11]=0; o[12]=p[0]; o[13]=p[1]; o[14]=p[2]; o[15]=1; return o;
  },
  scale(o, x, y, z) { o.fill(0); o[0] = x; o[5] = y; o[10] = z; o[15] = 1; return o; },
  translate(o, x, y, z) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; o[12] = x; o[13] = y; o[14] = z; return o; }
};
const xfP = (m, p) => [m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12], m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13], m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];
const xfD = (m, d) => [m[0]*d[0]+m[4]*d[1]+m[8]*d[2], m[1]*d[0]+m[5]*d[1]+m[9]*d[2], m[2]*d[0]+m[6]*d[1]+m[10]*d[2]];
const Q = {
  mul(a, b) { return [a[0]*b[3]+a[3]*b[0]+a[1]*b[2]-a[2]*b[1], a[1]*b[3]+a[3]*b[1]+a[2]*b[0]-a[0]*b[2], a[2]*b[3]+a[3]*b[2]+a[0]*b[1]-a[1]*b[0], a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]]; },
  axis(x, y, z, a) { const s = Math.sin(a / 2); return [x*s, y*s, z*s, Math.cos(a / 2)]; },
  eulerYXZ(x, y, z) {
    const c1=Math.cos(x/2), c2=Math.cos(y/2), c3=Math.cos(z/2), s1=Math.sin(x/2), s2=Math.sin(y/2), s3=Math.sin(z/2);
    return [s1*c2*c3+c1*s2*s3, c1*s2*c3-s1*c2*s3, c1*c2*s3-s1*s2*c3, c1*c2*c3+s1*s2*s3];
  }
};

// ───────────────────────── WebGL 2 ─────────────────────────
const canvas = $('gl');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, xrCompatible: true, powerPreference: 'high-performance' });
if (!gl) { fatal('This page needs WebGL 2, which this browser does not provide. Try a current version of Chrome, Edge, Firefox or Safari.'); return; }
const extCBF = gl.getExtension('EXT_color_buffer_float');
const extFL = gl.getExtension('OES_texture_float_linear');
let DATA_FMT = extCBF ? (extFL ? gl.RGBA32F : gl.RGBA16F) : gl.RGBA8;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    throw new Error('Shader compile failed: ' + log);
  }
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Program link failed: ' + gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}

// ───────────────────────── shaders ─────────────────────────
const HDR = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\nprecision mediump samplerCube;\n';
const COMMON = `
uniform vec3 uPalA, uPalB, uPalC, uPalD;
vec3 pal(float t){ return uPalA + uPalB*cos(6.2831853*(uPalC*t + uPalD)); }
vec3 tonemap(vec3 c){ c = max(c, vec3(0.0)); c = (c*(2.51*c + 0.03))/(c*(2.43*c + 0.59) + 0.14); return pow(clamp(c, 0.0, 1.0), vec3(0.4545)); }
`;
const DATA = `
uniform sampler2D uTexA, uTexB;
uniform vec3 uMapA, uMapB;
uniform float uMix;
float covg(vec2 uv){ vec2 e = min(uv, 1.0 - uv); return clamp(min(e.x, e.y)*60.0, 0.0, 1.0); }
vec4 samp(sampler2D t, vec3 m, vec2 p){ vec2 uv = 0.5 + m.xy + p*m.z; vec4 d = texture(t, uv); float c = covg(uv); d.r *= c; d.a *= c; return d; }
vec4 dataAt(vec2 p){
  if (uMix >= 0.999) return samp(uTexB, uMapB, p);
  if (uMix <= 0.001) return samp(uTexA, uMapA, p);
  return mix(samp(uTexA, uMapA, p), samp(uTexB, uMapB, p), uMix);
}
float covAt(vec2 p){
  float b = covg(0.5 + uMapB.xy + p*uMapB.z);
  if (uMix >= 0.999) return b;
  return mix(covg(0.5 + uMapA.xy + p*uMapA.z), b, uMix);
}
`;
const VS_FULL = HDR + `void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p*2.0 - 1.0, 0.0, 1.0); }`;

// Perturbation iteration with Zhuoran rebasing; float64 reference orbit lives in uRef (RG32F).
const FS_MANDEL = HDR + `
uniform sampler2D uRef;
uniform int uRefLen, uMaxIter;
uniform vec2 uOff;
uniform float uSpan, uN, uLnSpan, uMu0, uDensity, uLnA, uLnK;
out vec4 o;
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
void main(){
  vec2 p = gl_FragCoord.xy/uN - 0.5;
  vec2 dc = uOff + p*uSpan;
  vec2 dz = vec2(0.0), der = vec2(0.0), w = vec2(1.0, 0.0), z = vec2(0.0);
  float ls = 0.0, r2 = 0.0, minR2 = 1e30;
  int m = 0, n = 0, pmin = 1;
  bool esc = false;
  while (n < uMaxIter) {
    vec2 Z = texelFetch(uRef, ivec2(m & 1023, m >> 10), 0).xy;
    z = Z + dz;
    r2 = dot(z, z);
    if (r2 > 1e8) { esc = true; break; }
    if (n > 0 && r2 < minR2) { minR2 = r2; pmin = n; }
    der = 2.0*cmul(z, der) + vec2(1.0, 0.0);
    if (dot(der, der) > 1e24) { der *= 1e-12; ls += 27.631021; }
    if (n > 0) {
      w = 2.0*cmul(z, w);
      float w2 = dot(w, w);
      if (w2 > 1e20) w *= 1e-10;
      else if (n > 1 && w2 < 1e-24) break;
    }
    if (r2 < dot(dz, dz) || m >= uRefLen - 1) { dz = z; m = 0; Z = vec2(0.0); }
    dz = cmul(2.0*Z + dz, dz) + dc;
    m++; n++;
  }
  if (esc) {
    float lz = 0.5*log(r2);
    float mu = float(n) + 1.0 - log2(lz);
    float lnDE = log(sqrt(r2)*lz) - 0.5*log(max(dot(der, der), 1e-30)) - ls;
    float x = uLnSpan - lnDE;
    float t = 1.0 - exp(-max(x - uLnA, 0.0)/uLnK);
    float h = 0.96*pow(t, 1.2);
    float ph = uDensity*log2(max(mu - uMu0, 0.0) + 1.0);
    o = vec4(h, 0.5 + 0.5*cos(6.2831853*ph), 0.5 + 0.5*sin(6.2831853*ph), 0.0);
